[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confident-grip"
version = "0.1.0"
description = "Проверка команд при распознавании хватов по поверхностной ЭМГ"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
documents = ["reportlab>=4,<5"]

[project.scripts]
grip-experiment = "confident_grip.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
